[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtensor-cli"
version = "0.1.0"
description = "The mtensor command for Microtensor customers: bridge your coding tools to Microtensor models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tomlkit>=0.12",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mtensor = "microtensor_cli.app:main"

[project.urls]
Homepage = "https://www.microtensor.cloud"
Documentation = "https://www.microtensor.cloud/docs/api/getting-started/bridge"
Repository = "https://github.com/microtensor-io/microtensor-cli"

[tool.setuptools.packages.find]
include = ["microtensor_cli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"microtensor_cli/bridge/editors/safestorage.py" = ["S303"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
